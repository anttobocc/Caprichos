{% comment %}
Editor de imagen en modo "recorte" (posición X/Y y zoom).

Contexto:
  campo_imagen, campo_pos_x, campo_pos_y, campo_zoom -> campos del formulario
  imagen_actual -> imagen guardada (vacía si es nuevo)
  aspecto       -> relación de aspecto, ej. "4 / 3" (opcional)
  etiqueta      -> texto del <label> (opcional)
{% endcomment %}
<div class="admin-field">
    <label>{{ etiqueta|default:"Imagen" }}</label>
    {{ campo_imagen }}
    {% if campo_imagen.help_text %}<span class="admin-field__ayuda">{{ campo_imagen.help_text|safe }}</span>{% endif %}
    {% for error in campo_imagen.errors %}<span class="admin-field__error">{{ error }}</span>{% endfor %}
</div>

<div class="admin-imagen-editor" data-imagen-editor data-modo="recorte" style="--admin-editor-aspecto:{{ aspecto|default:"4 / 3" }};">
    <span class="admin-field__ayuda">Arrastrá la imagen para elegir qué parte queda visible.</span>
    <div class="admin-imagen-editor__lienzo" data-lienzo>
        <img
            data-imagen-preview
            draggable="false"
            alt=""
            {% if not imagen_actual %}hidden{% endif %}
            {% if imagen_actual %}src="{{ imagen_actual.url }}"{% endif %}
        >
        <span class="admin-imagen-editor__vacio" data-imagen-vacio {% if imagen_actual %}hidden{% endif %}>Elegí una imagen para previsualizarla acá</span>
    </div>

    {{ campo_pos_x.as_hidden }}
    {{ campo_pos_y.as_hidden }}
    {{ campo_zoom.as_hidden }}
</div>
