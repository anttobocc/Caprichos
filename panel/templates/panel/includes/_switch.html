{% comment %}
Switch ON/OFF que envía un POST a la vista de toggle.
Uso: {% include "panel/includes/_switch.html" with accion_url=... activo=objeto.activo %}
Opcional: "campo" (por defecto "activo").
{% endcomment %}
<form method="post" action="{{ accion_url }}" class="admin-switch-form">
    {% csrf_token %}
    <label class="admin-switch" aria-label="{% if activo %}Activo, hacer clic para desactivar{% else %}Inactivo, hacer clic para activar{% endif %}">
        <input type="checkbox" name="{{ campo|default:'activo' }}" {% if activo %}checked{% endif %} onchange="this.form.requestSubmit()">
        <span class="admin-switch__track"><span class="admin-switch__thumb"></span></span>
    </label>
    <span class="admin-switch__etiqueta">{% if activo %}Activo{% else %}Inactivo{% endif %}</span>
</form>
