{% comment %}
Selector de fecha para fecha_pedido. Contexto: campo_id, campo_name,
fecha_min, fecha_max, fecha_valor ("YYYY-MM-DD" o vacío).
La validación se hace en CheckoutForm.clean_fecha_pedido.
{% endcomment %}
<div class="fecha-picker" data-fecha-picker data-min="{{ fecha_min|date:'Y-m-d' }}" data-max="{{ fecha_max|date:'Y-m-d' }}">
    <input type="hidden" name="{{ campo_name }}" id="{{ campo_id }}" value="{{ fecha_valor|default:'' }}" data-fecha-picker-input>
    <button type="button" class="fecha-picker__resumen" id="{{ campo_id }}-boton" data-fecha-picker-resumen aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>
        </svg>
        <span data-fecha-picker-texto class="fecha-picker__texto--vacio">Elegí una fecha</span>
    </button>
    <div class="fecha-picker__panel" data-fecha-picker-panel hidden role="listbox" aria-labelledby="{{ campo_id }}-boton">
        <div class="fecha-picker__grid" data-fecha-picker-grid></div>
    </div>
</div>
